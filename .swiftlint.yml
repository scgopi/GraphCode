included:
  - graphcode
  - graphcoded

excluded:
  - .build
  - Tuist
  - "**/.build"
  - "**/DerivedData"

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - redundant_nil_coalescing
  - sorted_imports

disabled_rules:
  - todo
  # Conflicts head-on with `.swift-format`'s `multiElementCollectionTrailingCommas: true`,
  # which this project has deliberately enabled. `make format` runs swift-format first and
  # swiftlint --fix second, so with both active the two tools would undo each other and
  # `make check` could never pass on a multiline collection literal. swift-format's
  # setting is the explicit choice here, so it wins.
  - trailing_comma

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

reporter: "xcode"
