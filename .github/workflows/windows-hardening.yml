name: Windows release hardening

on:
  workflow_dispatch:
    inputs:
      environment_target:
        description: "Workspace-relative path to the owned environment harness"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"
  pull_request:

permissions:
  contents: read

# Superseded pull request pushes cancel their in-flight run. Every other event
# gets a unique group, so scheduled, dispatched, and main runs are never
# cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      native_a11y: ${{ steps.classify.outputs.native_a11y }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash Tools/ci/classify-changes.sh --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  # The two matrix legs are required checks by their expanded names. A job-level `if`
  # that skips a matrix job reports one unexpanded check name instead, leaving the
  # required ones pending, so the legs always run and gate their steps. A leg with
  # nothing to validate lands on a cheap Linux runner and passes without steps.
  deterministic:
    name: "Deterministic hardening (${{ matrix.os }}, ${{ matrix.powershell }})"
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        powershell: [pwsh]
    env:
      HARDENING_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.windows == 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.windows == 'true') && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: No Windows-relevant changes
        if: env.HARDENING_REQUIRED != 'true'
        run: echo "No Windows-relevant paths changed; deterministic hardening is not required."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.HARDENING_REQUIRED == 'true'
      - name: Run hardening contract
        if: env.HARDENING_REQUIRED == 'true'
        shell: pwsh
        run: ./Tools/windows/validate.ps1 -Task hardening
      - name: Verify runner contract
        if: env.HARDENING_REQUIRED == 'true'
        shell: pwsh
        run: ./Tools/windows/Tests/ValidationRunner.Tests.ps1
      - name: Resolve capture contract failure diagnostics root
        id: capture_temp
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetTempPath().TrimEnd([char[]]'\/')
          if ($root.Contains("`r") -or $root.Contains("`n") -or
              -not [IO.Path]::IsPathFullyQualified($root) -or
              -not (Test-Path -LiteralPath $root -PathType Container)) {
            throw 'Capture diagnostics require the actual absolute temporary directory.'
          }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_OUTPUT) -or
              -not [IO.Path]::IsPathFullyQualified($env:GITHUB_OUTPUT) -or
              -not (Test-Path -LiteralPath $env:GITHUB_OUTPUT -PathType Leaf)) {
            throw 'Capture diagnostics require the runner output file.'
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "root=$root`n", [Text.UTF8Encoding]::new($false))
      - name: Retain capture contract failure diagnostics
        if: ${{ failure() && steps.capture_temp.conclusion == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-capture-hardening-${{ matrix.os }}-${{ matrix.powershell }}-${{ github.run_attempt }}
          path: |
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\suite\**\*.json
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\suite\**\*.jsonl
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\suite\**\*.log
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\prebuilt\fixtures.json
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\prebuilt\**\provenance.json
            ${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\prebuilt\**\compile*.log
            !${{ steps.capture_temp.outputs.root }}\gc-ui-capture-*\suite\**\.git\**
          if-no-files-found: warn
          retention-days: 7

  native-accessibility:
    name: "Native accessibility provider"
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.native_a11y != 'false') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify native accessibility harness failure attribution
        shell: pwsh
        run: ./Tools/windows/Tests/AccessibilityProvider.Native.Tests.Harness.Tests.ps1
      - name: Run native accessibility provider tests
        shell: pwsh
        run: ./Tools/windows/Tests/AccessibilityProvider.Native.Tests.ps1

  full-pinned:
    name: "Full pinned Windows validation"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify native accessibility harness failure attribution
        shell: pwsh
        run: ./Tools/windows/Tests/AccessibilityProvider.Native.Tests.Harness.Tests.ps1
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          cache: true
      - name: Bootstrap exact Windows dependencies
        shell: pwsh
        run: ./Tools/windows/bootstrap.ps1 -ToolRoot .ci-tools -ProviderRoot .ci-providers
      - name: Run complete release gate
        shell: pwsh
        run: ./Tools/windows/validate.ps1 -Task all -SkipTrayLive -SkipWslRemoteE2E
      - name: Run real hardening matrix after release products
        shell: pwsh
        env:
          GRAPHCODE_HARDENING_TARGET: ${{ github.workspace }}\Tools\windows\Tests\EnvironmentFixture.ps1
        run: ./Tools/windows/Tests/Hardening.Tests.ps1 -Environment -SkipTrayLive

  environment:
    name: "Gated environment hardening"
    if: github.event_name == 'workflow_dispatch' && inputs.environment_target != ''
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run explicitly selected environment tier
        shell: pwsh
        env:
          GRAPHCODE_HARDENING_TARGET: ${{ inputs.environment_target }}
        run: ./Tools/windows/Tests/Hardening.Tests.ps1 -Environment -SchemaOnly
