name: Windows port validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# Superseded pull request pushes cancel their in-flight run. Every other event
# gets a unique group, so runs on main, dispatches, and merge queues are never
# cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.ci-tools\zig-global

# `validate.ps1 -Task all` minus the tasks other required workflows already run
# on every Windows-relevant pull request: windows-shell and packaging run in
# windows-shell.yml (required check `windows-shell`), and hardening runs in
# windows-hardening.yml (required `Deterministic hardening (...)` checks). The
# remaining tasks are split across two parallel parts behind the required
# `windows-spikes` aggregate job.
jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      macos: ${{ steps.classify.outputs.macos }}
      linux: ${{ steps.classify.outputs.linux }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash Tools/ci/classify-changes.sh --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  # Deliberately ungated: documentation-only investigation/ changes skip
  # windows-spikes, but still must not leak local paths or generated artifacts.
  # The task needs no toolchain or providers and takes about a second.
  investigation-privacy:
    name: Investigation privacy scan
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run investigation privacy checks
        shell: pwsh
        run: ./Tools/windows/validate.ps1 -Task privacy

  # The Swift spikes, production package tests and clean-runtime smoke, and the
  # swift-format gate. The runner contract also runs here, where Swift exists,
  # so its unformatted-source negative control exercises the real formatter.
  spikes-swift:
    name: windows-spikes Swift
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.windows == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 5

      - name: Install pinned Swift toolchain
        uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        timeout-minutes: 10
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
          cache: true

      - name: Restore pinned Zig toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-tools/zig-0.15.2
            .ci-tools/zig-0.16.0
          key: windows-zig-v1-${{ hashFiles('Tools/windows/bootstrap.ps1') }}

      - name: Bootstrap exact Windows dependencies
        shell: pwsh
        timeout-minutes: 30
        run: ./Tools/windows/bootstrap.ps1 -ToolRoot .ci-tools -ProviderRoot .ci-providers

      - name: Verify validation runner contract
        shell: pwsh
        timeout-minutes: 15
        run: ./Tools/windows/Tests/ValidationRunner.Tests.ps1

      - name: Run Swift Windows port validation
        shell: pwsh
        timeout-minutes: 35
        run: ./Tools/windows/validate.ps1 -Task swift-portable,swift-contracts,swift-production,swift-paths,swift-process,swift-named-pipe,swift-format

      # The swift-production run above skips the real-zmx test (no zmx.exe). This step
      # builds the pinned zmx and fails unless that test executed and passed.
      - name: Run real zmx empty-list test (required, not skippable)
        shell: pwsh
        timeout-minutes: 20
        run: |
          $env:GRAPHCODE_ZMX_ROOT = (Resolve-Path .ci-providers/zmx).Path
          $env:GRAPHCODE_ZIG0160 = (Resolve-Path .ci-tools/zig-0.16.0/zig.exe).Path
          ./Tools/windows/Test-RealZmxEmptyList.ps1
  # Everything else in -Task all: remote bridge and E2E, visual baseline, TDD
  # evidence, privacy, and the pinned terminal gate.
  spikes-other:
    name: windows-spikes terminal and contracts
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.windows == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 5

      - name: Restore pinned Zig toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-tools/zig-0.15.2
            .ci-tools/zig-0.16.0
          key: windows-zig-v1-${{ hashFiles('Tools/windows/bootstrap.ps1') }}

      - name: Restore pinned provider build caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 10
        with:
          path: |
            .ci-providers
            .ci-tools/zig-global
          key: windows-providers-v1-${{ hashFiles('graphcode-windows/provider-pins.json', 'Tools/windows/bootstrap.ps1') }}-emit-win32-host-x86_64-windows-gnu

      - name: Bootstrap exact Windows dependencies
        shell: pwsh
        timeout-minutes: 30
        run: ./Tools/windows/bootstrap.ps1 -ToolRoot .ci-tools -ProviderRoot .ci-providers -SkipSwift

      - name: Verify provider pins after cache restore
        shell: pwsh
        timeout-minutes: 5
        run: ./Tools/windows/Assert-ProviderCheckout.ps1 -ProviderRoot .ci-providers

      - name: Run Windows port validation
        shell: pwsh
        timeout-minutes: 30
        run: ./Tools/windows/validate.ps1 -Task all -SkipTrayLive -SkipWslRemoteE2E -SkipTask swift-portable,swift-contracts,swift-production,swift-paths,swift-process,swift-named-pipe,swift-format,windows-shell,packaging,hardening

      - name: Retain UIA failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 5
        with:
          name: uia-live-gate-diagnostics
          path: ${{ runner.temp }}\gu-*\logs\*.json
          if-no-files-found: warn
          retention-days: 7

  windows-spikes:
    needs: [changes, spikes-swift, spikes-other]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WINDOWS_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.windows == 'true' }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Require every Windows spikes part
        shell: pwsh
        run: ./Tools/windows/Assert-CiPartResults.ps1 -NeedsJson $env:NEEDS_JSON -Required $env:WINDOWS_REQUIRED
